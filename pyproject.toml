[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "leaguepilot-ai"
version = "0.3.0"
description = "LEAGUEPILOT AI — ESPN-first fantasy intelligence and league automation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "QuntmTech" }]
dependencies = [
  "cryptography>=50,<51",
  "fastapi==0.141.1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pip-audit>=2.10,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
leaguepilot-ai = "app.cli:main"
fantasy-command-center = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
