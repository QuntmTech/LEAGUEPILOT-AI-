services:
  leaguepilot-ai:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    environment:
      FCC_HOST: 0.0.0.0
      FCC_DATABASE_URL: sqlite:////data/fantasy-command-center.db
    volumes:
      - command-center-data:/data
    restart: unless-stopped

  fantasy-warroom-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      LEAGUEPILOT_MCP_HOST: 0.0.0.0
      LEAGUEPILOT_MCP_PORT: 8787
      LEAGUEPILOT_MCP_PUBLIC_URL: http://127.0.0.1:8787
    restart: unless-stopped

  # Persistent queue worker.
  #
  # Exists because GitHub Actions scheduling is best-effort: measured over 38 h of
  # production history the */5 cron delivered 11 of an expected 457 runs (2.4%), with a
  # mean gap of 3.81 h and a worst case of 5.87 h. Each run drains for ~228 s, so the
  # queue sat unattended ~98% of the time. Deadline-sensitive work — the Sunday inactive
  # sweep above all — cannot tolerate that: PocketBase enqueues the sweep on time, but a
  # job created at 16:30 UTC could go unclaimed until after kickoff.
  #
  # This container closes that gap by staying alive and polling every 3 s.
  leaguepilot-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # No `ports`: outbound-only. The worker dials CloudPod and accepts no inbound traffic.
    env_file:
      - .env
    environment:
      FCC_CLOUDPOD_URL: https://leaguepilot-ai.cloudpod.pro
      # FCC_CLOUDPOD_WORKER_KEY is intentionally absent here. It must come from the
      # deployment secret store via env_file or the orchestrator — never committed,
      # never inlined in this file.
      FCC_CLOUDPOD_WORKER_ID: ${FCC_CLOUDPOD_WORKER_ID:-leaguepilot-worker-1}
      FCC_WORKER_POLL_SECONDS: "3"
      FCC_AVAILABILITY_PROVIDER: nflverse
      FCC_AI_PROVIDER: rules
    restart: unless-stopped

  # OAuth 2.1 authorization server for MCP browser clients (Claude.ai, ChatGPT).
  # Issues audience-bound tokens for the MCP resource; the MCP keeps accepting existing
  # PocketBase bearers, so this is additive and independently reversible.
  leaguepilot-auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    ports:
      - "127.0.0.1:8790:8790"
    env_file:
      - .env
    environment:
      LEAGUEPILOT_AUTH_ISSUER_URL: https://auth.leaguepilot.quntm.xyz/
      LEAGUEPILOT_AUTH_RESOURCE_URL: https://mcp.leaguepilot.quntm.xyz/
      LEAGUEPILOT_AUTH_CLOUDPOD_URL: https://leaguepilot-ai.cloudpod.pro
      LEAGUEPILOT_AUTH_HOST: 0.0.0.0
      LEAGUEPILOT_AUTH_PORT: 8790
      LEAGUEPILOT_AUTH_DATABASE_URL: sqlite:////data/leaguepilot-auth.db
      # LEAGUEPILOT_AUTH_ENCRYPTION_KEY comes from the secret store via env_file.
      # It must be stable across restarts: changing it invalidates every stored grant.
    volumes:
      - leaguepilot-auth-data:/data
    restart: unless-stopped

volumes:
  command-center-data:
  leaguepilot-auth-data:
