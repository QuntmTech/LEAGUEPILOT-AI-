name: LEAGUEPILOT AI CloudPod worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: leaguepilot-cloudpod-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FCC_CLOUDPOD_URL: https://leaguepilot-ai.cloudpod.pro
      FCC_CLOUDPOD_WORKER_KEY: ${{ secrets.FCC_CLOUDPOD_WORKER_KEY }}
      FCC_CLOUDPOD_WORKER_ID: gha-${{ github.run_id }}
      FCC_AVAILABILITY_PROVIDER: nflverse
      FCC_AVAILABILITY_CACHE_SECONDS: "900"
      FCC_AI_PROVIDER: rules
    steps:
      - uses: actions/checkout@v4

      - name: Check worker configuration
        id: preflight
        shell: bash
        run: |
          if [[ -z "$FCC_CLOUDPOD_WORKER_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add the FCC_CLOUDPOD_WORKER_KEY repository secret to activate the worker."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install worker
        if: steps.preflight.outputs.enabled == 'true'
        run: python -m pip install .

      - name: Drain CloudPod jobs
        if: steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          status=0
          timeout --signal=TERM --kill-after=15s 210s leaguepilot-ai worker || status=$?
          if [[ "$status" -ne 0 && "$status" -ne 124 && "$status" -ne 143 ]]; then
            exit "$status"
          fi
